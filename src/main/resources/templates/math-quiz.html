<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<style> 
	h1 {
			text-align: center; 
	    }
		

	    .form-container {
			display: flex;
	       justify-content: center;
	       align-items: center;
	        text-align: center;
	        background: #fff;
	        padding: 50px;
	        border-radius: 10px; 
	    }

	   
	    ol {
	        text-align: left;
	        display: inline-block; 
	    }

	    input[type="text"] {
	        width: 500px;   
	        padding: 8px;
	        margin: 5px 0 15px 0;
	        border: 3px solid #ccc;
	        border-radius: 5px;
			background-color: #f0f0f0; 
	    }

	    button {
	        padding: 10px 10px;
	        font-size: 16px;
	        border: none;
	        border-radius: 5px;
	        background-color: #EEEBFC;
	        color: black;
			border: 3px solid #ccc;
	    }
	</style>

</style>
</head>
<body>
	
<h1> Math quiz </h1>

<div class="form-container">
<form action="/quiz/math/submit" method="post" >
	<ol>
	    <li th:each="q, iterStat : ${questions}">
	        <span th:text="${q.text}"></span> <br> 
	        <input type="text" name="answers" />
	    </li>
	</ol>
      <br>  <button type="submit">Submit Answers</button>
    </form>
</div> 



</body>
</html>
