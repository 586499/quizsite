<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<style>
	body {
	margin: 0;
    padding: 0;
	  background-color: white;
	}
	
h1 {
  display: block;
  color: black;
  text-align: center;
  margin: 100px auto 40px auto;
  padding: 20px 10px;
  border: 2px solid black; 
  background-color: #f0f0f0;
  width: 500px;  
}

P{
  color: black;
  text-align:center;
  margin-top: 30px;
  font-size: 20px;
}

.form-container {
  width: 300px;         
  margin: 30px auto;    
}

.inputID{
	text-align: left;
	  margin-top: 30px;
}
.inputID label{
	display: block;     
	 margin-bottom: 2px; 
	 text-align: left; 
}
.inputID input{ 
	width: 100%;
	padding: 4px 8px;          
	font-size: 16px;
	border-radius: 4px;
	border: 2px solid #888;
	box-sizing: border-box;
	margin-top: 0;     
	margin-bottom: 20px;         
}

button{
	display: block;
	margin: 0 auto;  
	background-color: #EEEBFC;
	border: 1px solid #020104;
}
</style>
</head>


<body>
	
    <h1>Online quiz system for students <br> 學生線上測驗系統 </h1>
	
    <p><b>學生帳號登入 Login student Account</b></p>
	
	
	<form action="/student/login" method="post" style="text-align: center;" >
	<div class= "form-container">
	<div class="inputID">
	<label for="studentID">Student ID:</label>
	<input
	  type="text"
	  id="studentID"
	  name="studentID"
	  required
	  minlength="1"
	  maxlength="100"
	  size="10" />

	 
	  <label for="name">Name:</label>
	  	<input
	  	  type="text"
	  	  id="name"
	  	  name="name"
	  	  required
	  	  minlength="1"
	  	  maxlength="100"
	  	  size="10" />
	  	  	  
	  
	  </div>
      </div>
	
	
	<div> 
	
	    <button type="submit">Login</button>

	</div> 
	</form> 
</body>
</html>
